media:
  input: public/images
  output: /images

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content/insights
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, area, publicationDate, draft]
      sort: [publicationDate, title]
      search: [title, description, area, subtopic, tags]
      default: { sort: publicationDate, order: desc }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: description, label: Description, type: text, required: true }
      - { name: publicationDate, label: Publication date, type: date, required: true }
      - { name: updatedDate, label: Updated date, type: date }
      - name: area
        label: Expertise area
        type: select
        required: true
        options:
          values: [Sustainability & Climate Change, Geospatial Intelligence, Biodiversity & Nature, Circular Economy, Carbon Markets & Methodologies]
      - { name: subtopic, label: Subtopic, type: string }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: featured, label: Featured, type: boolean }
      - { name: draft, label: Draft, type: boolean, required: true }
      - { name: author, label: Author, type: string, required: true }
      - { name: image, label: Image, type: image }
      - { name: body, label: Article, type: rich-text, options: { format: markdown, media: true, path: public/images/insights, rename: true } }

  - name: library
    label: Library
    type: collection
    path: src/content/library
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    view:
      primary: title
      fields: [title, area, entryType, lastReviewed, draft]
      search: [title, summary, area, entryType, organisation, identifier]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: area
        label: Expertise area
        type: select
        required: true
        options:
          values: [Sustainability & Climate Change, Geospatial Intelligence, Biodiversity & Nature, Circular Economy, Carbon Markets & Methodologies]
      - name: entryType
        label: Entry type
        type: select
        required: true
        options:
          values: [Methodology, Framework, Standard, Analytical Method, Guidance, Tool]
      - { name: organisation, label: Organisation, type: string }
      - { name: identifier, label: Identifier, type: string }
      - { name: version, label: Version, type: string }
      - { name: publicationDate, label: Publication date, type: date }
      - { name: lastReviewed, label: Last reviewed, type: date, required: true }
      - { name: summary, label: Summary, type: text, required: true }
      - { name: applicability, label: Applicability, type: text, required: true }
      - { name: keyConcepts, label: Key concepts, type: string, list: true }
      - { name: keyRequirements, label: Key requirements, type: string, list: true }
      - { name: strengths, label: Strengths, type: string, list: true }
      - { name: limitations, label: Limitations, type: string, list: true }
      - { name: officialSource, label: Official source, type: string }
      - { name: relatedArticles, label: Related articles, type: string, list: true }
      - { name: baseline, label: Baseline, type: text }
      - { name: additionality, label: Additionality, type: text }
      - { name: mrv, label: MRV, type: text }
      - { name: leakage, label: Leakage, type: text }
      - { name: permanence, label: Permanence, type: text }
      - { name: creditingPeriod, label: Crediting period, type: text }
      - { name: validation, label: Validation, type: text }
      - { name: verification, label: Verification, type: text }
      - { name: draft, label: Draft, type: boolean, required: true }
      - { name: body, label: Entry content, type: rich-text, options: { format: markdown, media: true, path: public/images/library, rename: true } }

  - name: research
    label: Research archive
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    filename: { template: "{primary}.md", field: create }
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, required: true }
      - { name: category, type: string, required: true }
      - { name: tags, type: string, list: true }
      - { name: featured, type: boolean }
      - { name: draft, type: boolean, required: true }
      - { name: author, type: string, required: true }
      - { name: body, type: rich-text, options: { format: markdown } }

  - name: projects
    label: Projects archive
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    exclude: [.gitkeep]
    filename: { template: "{primary}.md", field: create }
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, required: true }
      - { name: category, type: string, required: true }
      - { name: status, type: string, required: true }
      - { name: tags, type: string, list: true }
      - { name: featured, type: boolean }
      - { name: draft, type: boolean, required: true }
      - { name: author, type: string, required: true }
      - { name: body, type: rich-text, options: { format: markdown } }
